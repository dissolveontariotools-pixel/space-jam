<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>SPACE JAM · the jam from the space · Dissolve Ontario</title>
<meta name="description" content="Sit in the space, let it release, get the jam. Dissolve sessions and weekly practice with Jordan, Dissolve Ontario.">
<style>
:root{--gold:#f2c46d;--amber:#ff9a3c;--cream:#f4ede1}
*{box-sizing:border-box;margin:0}
html,body{height:100%;background:#050505;overflow:hidden;font-family:system-ui,-apple-system,Segoe UI,sans-serif;color:var(--cream)}
canvas{position:fixed;inset:0;width:100%;height:100%;touch-action:none}
.ui{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;pointer-events:none;text-align:center;padding:24px}
h1{font-family:"Arial Black",Impact,sans-serif;font-size:clamp(56px,14vw,180px);letter-spacing:-.02em;line-height:.9;
 background:linear-gradient(180deg,#fff6d8 0%,var(--gold) 45%,var(--amber) 100%);-webkit-background-clip:text;background-clip:text;color:transparent;
 filter:drop-shadow(0 0 24px rgba(242,196,109,.45));transform:rotate(-4deg);animation:bob 3.2s ease-in-out infinite}
h1 span{display:block;font-size:.62em;transform:translateX(.35em)}
.tag{margin-top:28px;font-size:clamp(15px,2.4vw,22px);opacity:.85;letter-spacing:.04em}
.tag b{color:var(--gold);font-weight:600}
.hint{position:fixed;bottom:26px;width:100%;text-align:center;font-size:13px;letter-spacing:.2em;text-transform:uppercase;opacity:.5;pointer-events:none;animation:pulse 2.4s ease-in-out infinite}
.count{position:fixed;top:20px;right:22px;font-size:13px;letter-spacing:.12em;opacity:.6;pointer-events:none}
@keyframes bob{50%{transform:rotate(-2deg) translateY(-10px) scale(1.02)}}
@keyframes pulse{50%{opacity:.2}}
@media (prefers-reduced-motion:reduce){h1,.hint{animation:none}}

.panel{position:fixed;left:50%;bottom:64px;transform:translateX(-50%);width:min(560px,calc(100% - 32px));background:rgba(12,10,8,.72);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border:1px solid rgba(242,196,109,.28);border-radius:18px;padding:16px;z-index:5}
.panel form{display:flex;gap:8px;flex-wrap:wrap}
.panel input[type=email]{flex:1 1 220px;min-height:46px;border-radius:12px;border:1px solid rgba(242,196,109,.35);background:#0b0a09;color:var(--cream);padding:0 14px;font-size:16px}
.btn{min-height:46px;border-radius:12px;border:0;padding:0 18px;font-weight:700;font-size:15px;cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;justify-content:center}
.btn.gold{background:linear-gradient(180deg,#ffd98c,#f2b24f);color:#1a1206}
.btn.ghost{background:transparent;color:var(--gold);border:1px solid rgba(242,196,109,.45)}
.links{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}.links .btn{flex:1 1 200px}
.msg{font-size:14px;margin-top:8px;min-height:1em;color:var(--gold)}
.small{font-size:12px;opacity:.6;margin-top:6px}
.hint{bottom:auto;top:20px;left:22px;width:auto;text-align:left}
.ui{padding-bottom:220px}
@media (max-height:640px){.ui h1{font-size:clamp(44px,11vw,120px)}}
@media (max-width:600px){.count{display:none}.hint{left:0;width:100%;text-align:center;font-size:11px}.panel form .btn{flex:1 1 100%}.ui{padding-bottom:300px}.ui h1{font-size:22vw}}
</style></head><body>
<canvas id="c"></canvas>
<div class="ui">
 <h1>SPACE<span>JAM</span></h1>
 <p class="tag">sit in the space · let it release · <b>get the jam</b></p>
</div>
<div class="count" id="n">jams released: 0</div>

<div class="panel">
 <form id="f" action="https://formsubmit.co/dissolveontario.tools@gmail.com" method="POST">
  <input type="email" name="email" required placeholder="your@email.com" aria-label="Your email" autocomplete="email">
  <input type="hidden" name="_subject" value="New Space Jam sign-up">
  <input type="hidden" name="_captcha" value="false">
  <input type="hidden" name="_template" value="table">
  <input type="text" name="_honey" style="display:none" tabindex="-1" autocomplete="off">
  <input type="hidden" name="source" value="Space Jam page">
  <button class="btn gold" type="submit">Get the jam</button>
 </form>
 <div class="msg" id="m" role="status"></div>
 <div class="links">
  <a class="btn ghost" href="https://calendly.com/dissolveontario/dissolve-alignment-bodywork" target="_blank" rel="noopener">Book a Dissolve bodywork session</a>
  <a class="btn ghost" href="https://calendly.com/dissolveontario/dissolve-practice" target="_blank" rel="noopener">Join the weekly practice (free)</a>
 </div>
 <div class="small">Leave your email for occasional notes on practice and sessions. No spam.</div>
</div>
<div class="hint">tap anywhere to release · hold to sit</div>
<script>
const c=document.getElementById('c'),x=c.getContext('2d');let W,H,D=Math.min(devicePixelRatio||1,2);
function rs(){W=innerWidth;H=innerHeight;c.width=W*D;c.height=H*D;x.setTransform(D,0,0,D,0,0)}rs();addEventListener('resize',rs);
const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
const stars=[...Array(220)].map(()=>({x:Math.random(),y:Math.random(),r:Math.random()*1.4+.2,t:Math.random()*6}));
let waves=[],drops=[],jams=0,hold=null,charge=0;
const pal=['#f2c46d','#ff9a3c','#fff1c9','#e8b04f','#ffd88a'];
function release(px,py,power=1){jams++;document.getElementById('n').textContent='jams released: '+jams;
 for(let i=0;i<3;i++)waves.push({x:px,y:py,r:0,a:1,s:(2.2+i*1.3)*power,w:(6-i*1.5)*power});
 const n=Math.round(46*power);for(let i=0;i<n;i++){const a=Math.random()*Math.PI*2,v=(1.5+Math.random()*5)*power;
  drops.push({x:px,y:py,vx:Math.cos(a)*v,vy:Math.sin(a)*v,r:2+Math.random()*5*power,l:1,c:pal[i%pal.length],wob:Math.random()*6})}}
c.addEventListener('pointerdown',e=>{hold={x:e.clientX,y:e.clientY,t:performance.now()};charge=0});
addEventListener('pointerup',e=>{if(!hold)return;const p=Math.min(1+charge*2.2,3.2);release(hold.x,hold.y,p);hold=null;charge=0});
let t=0;function frame(){t+=1/60;x.fillStyle='rgba(5,5,5,.28)';x.fillRect(0,0,W,H);
 // breathing core
 const cx=W/2,cy=H/2,br=Math.min(W,H)*(.22+.03*Math.sin(t*.9));
 const g=x.createRadialGradient(cx,cy,0,cx,cy,br*2.2);g.addColorStop(0,'rgba(242,196,109,.16)');g.addColorStop(.5,'rgba(255,154,60,.05)');g.addColorStop(1,'rgba(0,0,0,0)');
 x.fillStyle=g;x.fillRect(0,0,W,H);
 for(const s of stars){s.t+=.02;x.globalAlpha=.25+.35*Math.sin(s.t);x.fillStyle='#f4ede1';x.beginPath();x.arc(s.x*W,s.y*H,s.r,0,7);x.fill()}x.globalAlpha=1;
 if(hold){charge=Math.min((performance.now()-hold.t)/1600,1);const r=20+charge*90;
  x.strokeStyle=`rgba(242,196,109,${.3+charge*.5})`;x.lineWidth=2+charge*4;x.beginPath();x.arc(hold.x,hold.y,r*(1-.08*Math.sin(t*8)),0,7);x.stroke()}
 waves=waves.filter(w=>w.a>0.01);for(const w of waves){w.r+=w.s*(reduce?.5:1)*3;w.a*=.975;
  x.strokeStyle=`rgba(242,196,109,${w.a})`;x.lineWidth=w.w*w.a+.5;x.shadowColor='#ffb84d';x.shadowBlur=18;x.beginPath();x.arc(w.x,w.y,w.r,0,7);x.stroke()}x.shadowBlur=0;
 drops=drops.filter(d=>d.l>0.02);for(const d of drops){d.vx*=.985;d.vy=d.vy*.985+.035;d.x+=d.vx;d.y+=d.vy;d.l*=.988;
  const sq=1+.25*Math.sin(t*10+d.wob);x.globalAlpha=d.l;x.fillStyle=d.c;x.beginPath();x.ellipse(d.x,d.y,d.r*sq,d.r/sq,0,0,7);x.fill()}x.globalAlpha=1;
 requestAnimationFrame(frame)}
frame();
// gentle auto-release so the page is alive
setInterval(()=>{if(!hold&&document.visibilityState==='visible')release(W*(.3+Math.random()*.4),H*(.35+Math.random()*.3),.7)},reduce?6000:3200);
setTimeout(()=>release(innerWidth/2,innerHeight/2,1.8),400);

document.getElementById('f').addEventListener('submit',async e=>{e.preventDefault();const f=e.target,m=document.getElementById('m');
 if(f._honey.value)return;m.textContent='Sending…';
 try{const r=await fetch('https://formsubmit.co/ajax/dissolveontario.tools@gmail.com',{method:'POST',headers:{'Content-Type':'application/json',Accept:'application/json'},
  body:JSON.stringify({email:f.email.value,_subject:'New Space Jam sign-up',source:'Space Jam page'})});
  if(!r.ok)throw 0;m.textContent='Got it. The jam is on its way ✨';f.reset();const b=f.getBoundingClientRect();release(b.left+b.width/2,b.top,2.4)}
 catch(_){m.textContent='Hmm, that didn\'t send. Try again in a moment.'}});
</script></body></html>
